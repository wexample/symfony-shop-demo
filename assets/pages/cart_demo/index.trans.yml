en:
  page_title: Shop
  page_icon: ph:bold/storefront
  shop: Go to the shop
  cart: Cart
  intro: >-
    symfony-cart-ds on a catalogue of the demo's: a T-shirt shipped, a workshop
    with roles and dates of a few seats, a donation of the amount you choose.
    Put them in the cart, then order: the addresses, how to pay — the demo
    provider's card, Stripe in test mode, a transfer —, the confirmation.
  cases:
    title: What to try
    bought:
      title: An order through
      text: Order a T-shirt and pay with the demo provider's card, « Pay » on its page.
    sold_out:
      title: A date sold out
      text: The workshop's last date has one seat. Buy it once; the next buyer finds it sold out.
    failed:
      title: A payment failed, then taken up again
      text: « Decline » on the provider's page; the confirmation offers to choose again how to pay.
    expired:
      title: A cart left to expire
      text: A cart left unpaid gives its stock back when `bin/console cart:expire` runs.
