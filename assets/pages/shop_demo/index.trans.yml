en:
  page_title: Scenarios
  page_icon: ph:bold/list-checks
  shop: Go to the shop
  cart: Cart
  intro: >-
    symfony-shop-ds on a catalogue of the demo's: a T-shirt shipped, a workshop
    with roles and dates of a few seats, a donation of the amount you choose.
    Put them in the cart, then order: the addresses, how to pay — the demo
    provider's card, Stripe in test mode, a transfer —, the confirmation.
  cases:
    title: What to try
    bought:
      title: An order through
      text: Order a T-shirt and pay with the demo provider's card, « Pay » on its page.
    sold_out:
      title: A date sold out
      text: The workshop's last date has one seat. Buy it once; the next buyer finds it sold out.
    failed:
      title: A payment failed, then taken up again
      text: « Decline » on the provider's page; the confirmation offers to choose again how to pay.
    expired:
      title: A cart left to expire
      text: A cart left unpaid gives its stock back when `bin/console shop:expire` runs.

fr:
  page_title: Scénarios
  page_icon: 'ph:bold/list-checks'
  shop: 'Aller au magasin'
  cart: Panier
  intro: 'symfony-shop-ds sur un catalogue des démos : un T-shirt expédié, un atelier avec rôles et dates de quelques places, un don du montant de votre choix. Mettez-les dans le panier, puis commandez : les adresses, comment payer — la carte du fournisseur de démo, Stripe en mode test, un virement —, la confirmation.'
  cases:
    title: 'Que tester'
    bought:
      title: 'Une commande via'
      text: 'Commandez un T-shirt et payez avec la carte du fournisseur de démo, « Payer » sur sa page.'
    sold_out:
      title: 'Une date épuisée'
      text: "La dernière date de l'atelier a une place. Achetez-la une fois ; le prochain acheteur la trouve épuisée."
    failed:
      title: 'Un paiement échoué, puis relancé'
      text: '« Refuser » sur la page du fournisseur ; la confirmation propose de choisir à nouveau comment payer.'
    expired:
      title: 'Un panier laissé expirer'
      text: 'Un panier laissé impayé restitue son stock lorsque `bin/console shop:expire` est exécuté.'

zh:
  page_title: 场景
  page_icon: 'ph:bold/list-checks'
  shop: 前往商店
  cart: 购物车
  intro: 'symfony-shop-ds 在演示的目录中：一件已发货的T恤，一场有角色和几个座位日期的工作坊，一个您选择金额的捐赠。将它们放入购物车，然后下单：地址、支付方式——演示提供者的卡、测试模式下的Stripe、转账——，确认。'
  cases:
    title: 尝试什么
    bought:
      title: 通过下单
      text: 订购一件T恤，并使用演示提供者的卡支付，在其页面上点击“支付”。
    sold_out:
      title: 日期已售罄
      text: 工作坊的最后一个日期只有一个座位。买一次；下一个买家发现已售罄。
    failed:
      title: 支付失败，然后重新尝试
      text: 在提供者页面点击“拒绝”；确认提供再次选择支付方式。
    expired:
      title: 购物车未支付过期
      text: '未支付的购物车在运行 `bin/console shop:expire` 时将其库存归还。'

ar:
  page_title: السيناريوهات
  page_icon: 'ph:bold/list-checks'
  shop: 'اذهب إلى المتجر'
  cart: 'عربة التسوق'
  intro: 'symfony-shop-ds في كتالوج العرض: تي شيرت مشحون، ورشة عمل بأدوار وتواريخ لعدد قليل من المقاعد، تبرع بالمبلغ الذي تختاره. ضعها في العربة، ثم اطلب: العناوين، كيفية الدفع - بطاقة موفر العرض، Stripe في وضع الاختبار، تحويل -، التأكيد.'
  cases:
    title: 'ماذا تجرب'
    bought:
      title: 'طلب عبر'
      text: 'اطلب تي شيرت وادفع ببطاقة موفر العرض، « دفع » على صفحته.'
    sold_out:
      title: 'تاريخ نفد'
      text: 'آخر تاريخ للورشة لديه مقعد واحد. اشتره مرة واحدة؛ المشتري التالي يجده نفد.'
    failed:
      title: 'فشل الدفع، ثم تم استئنافه'
      text: '« رفض » على صفحة الموفر؛ التأكيد يعرض اختيار طريقة الدفع مرة أخرى.'
    expired:
      title: 'عربة تُركت لتنفد'
      text: 'عربة تُركت دون دفع تعيد مخزونها عندما يتم تشغيل `bin/console shop:expire`.'

hi:
  page_title: परिदृश्य
  page_icon: 'ph:bold/list-checks'
  shop: 'दुकान पर जाएं'
  cart: कार्ट
  intro: 'symfony-shop-ds पर डेमो के कैटलॉग में: एक टी-शर्ट भेजी गई, कुछ सीटों के लिए भूमिकाओं और तिथियों के साथ एक कार्यशाला, आपके द्वारा चुने गए राशि का एक दान। इन्हें कार्ट में डालें, फिर ऑर्डर करें: पते, भुगतान कैसे करें — डेमो प्रदाता का कार्ड, परीक्षण मोड में स्ट्राइप, एक ट्रांसफर —, पुष्टि।'
  cases:
    title: 'क्या आजमाएं'
    bought:
      title: 'एक ऑर्डर के माध्यम से'
      text: 'एक टी-शर्ट ऑर्डर करें और डेमो प्रदाता के कार्ड से भुगतान करें, इसके पृष्ठ पर « भुगतान करें »।'
    sold_out:
      title: 'एक तिथि बिक गई'
      text: 'कार्यशाला की अंतिम तिथि में एक सीट है। इसे एक बार खरीदें; अगला खरीदार इसे बिक गया पाएगा।'
    failed:
      title: 'एक भुगतान असफल हुआ, फिर से लिया गया'
      text: 'प्रदाता के पृष्ठ पर « अस्वीकार करें »; पुष्टि फिर से भुगतान करने का विकल्प देती है।'
    expired:
      title: 'एक कार्ट समाप्त होने के लिए छोड़ी गई'
      text: 'एक बिना भुगतान की गई कार्ट जब `bin/console shop:expire` चलती है, तो इसका स्टॉक वापस दे देती है।'

he:
  page_title: תסריטים
  page_icon: 'ph:bold/list-checks'
  shop: 'ללכת לחנות'
  cart: 'עגלת קניות'
  intro: 'symfony-shop-ds על קטלוג של הדמו: חולצה שנשלחה, סדנה עם תפקידים ותאריכים של כמה מקומות, תרומה של הסכום שתבחר. שים אותם בעגלת הקניות, ואז הזמן: הכתובות, איך לשלם — כרטיס של ספק הדמו, Stripe במצב בדיקה, העברה —, האישור.'
  cases:
    title: 'מה לנסות'
    bought:
      title: 'הזמנה דרך'
      text: 'הזמן חולצה ושלם עם כרטיס של ספק הדמו, «שלם» בעמוד שלו.'
    sold_out:
      title: 'תאריך נמכר'
      text: 'התאריך האחרון של הסדנה יש בו מקום אחד. קנה אותו פעם אחת; הקונה הבא מוצא אותו נמכר.'
    failed:
      title: 'תשלום נכשל, ואז נלקח שוב'
      text: '«סירוב» בעמוד של הספק; האישור מציע לבחור שוב איך לשלם.'
    expired:
      title: 'עגלת קניות שהושארה לפגות תוקף'
      text: 'עגלת קניות שהושארה ללא תשלום מחזירה את המלאי שלה כאשר `bin/console shop:expire` רץ.'

fa:
  page_title: سناریوها
  page_icon: 'ph:bold/list-checks'
  shop: 'به فروشگاه بروید'
  cart: 'سبد خرید'
  intro: 'symfony-shop-ds در یک کاتالوگ از دمو: یک تی‌شرت ارسال شده، یک کارگاه با نقش‌ها و تاریخ‌های چند صندلی، یک donation به مقدار انتخابی شما. آنها را در سبد خرید قرار دهید، سپس سفارش دهید: آدرس‌ها، نحوه پرداخت — کارت ارائه‌دهنده دمو، Stripe در حالت آزمایشی، یک انتقال —، تأییدیه.'
  cases:
    title: 'چه چیزی را امتحان کنیم'
    bought:
      title: 'یک سفارش از طریق'
      text: 'یک تی‌شرت سفارش دهید و با کارت ارائه‌دهنده دمو پرداخت کنید، «پرداخت» در صفحه آن.'
    sold_out:
      title: 'تاریخ تمام شده'
      text: 'آخرین تاریخ کارگاه یک صندلی دارد. یک بار خریداری کنید؛ خریدار بعدی آن را تمام شده پیدا می‌کند.'
    failed:
      title: 'پرداخت ناموفق، سپس دوباره انجام شد'
      text: '«رد» در صفحه ارائه‌دهنده؛ تأییدیه پیشنهاد می‌دهد دوباره نحوه پرداخت را انتخاب کنید.'
    expired:
      title: 'سبد خرید رها شده'
      text: 'یک سبد خرید که پرداخت نشده باشد، موجودی آن زمانی که `bin/console shop:expire` اجرا می‌شود، برمی‌گرداند.'

ur:
  page_title: مناظر
  page_icon: 'ph:bold/list-checks'
  shop: 'دکان پر جائیں'
  cart: کارٹ
  intro: 'symfony-shop-ds پر ڈیمو کی کیٹلاگ: ایک ٹی شرٹ بھیجی گئی، کچھ نشستوں کی تاریخوں اور کرداروں کے ساتھ ایک ورکشاپ، آپ کی منتخب کردہ رقم کا عطیہ۔ انہیں کارٹ میں ڈالیں، پھر آرڈر کریں: پتے، ادائیگی کا طریقہ — ڈیمو فراہم کنندہ کا کارڈ، ٹیسٹ موڈ میں Stripe، ایک ٹرانسفر —، تصدیق۔'
  cases:
    title: 'کیا آزمانا ہے'
    bought:
      title: 'ایک آرڈر کے ذریعے'
      text: 'ایک ٹی شرٹ آرڈر کریں اور ڈیمو فراہم کنندہ کے کارڈ سے ادائیگی کریں، اس کے صفحے پر « ادائیگی کریں »۔'
    sold_out:
      title: 'ایک تاریخ ختم ہوگئی'
      text: 'ورکشاپ کی آخری تاریخ میں ایک سیٹ ہے۔ اسے ایک بار خریدیں؛ اگلا خریدار اسے ختم شدہ پاتا ہے۔'
    failed:
      title: 'ایک ادائیگی ناکام ہوئی، پھر دوبارہ کی گئی'
      text: 'فراہم کنندہ کے صفحے پر « انکار »؛ تصدیق دوبارہ ادائیگی کا طریقہ منتخب کرنے کی پیشکش کرتی ہے۔'
    expired:
      title: 'ایک کارٹ کو ختم ہونے کے لیے چھوڑ دیا گیا'
      text: 'ایک ادائیگی نہ ہونے والا کارٹ `bin/console shop:expire` چلنے پر اپنے اسٹاک واپس دیتا ہے۔'

ja:
  page_title: シナリオ
  page_icon: 'ph:bold/list-checks'
  shop: ショップへ行く
  cart: カート
  intro: 'symfony-shop-dsはデモのカタログにおいて、発送されたTシャツ、役割と日付のあるワークショップ、選択した金額の寄付を提供しています。これらをカートに入れ、次に注文します：住所、支払い方法 — デモプロバイダーのカード、テストモードのStripe、振込 —、確認を行います。'
  cases:
    title: 試すこと
    bought:
      title: 注文を通して
      text: Tシャツを注文し、デモプロバイダーのカードで支払います。「支払う」をそのページでクリックしてください。
    sold_out:
      title: 売り切れの日付
      text: ワークショップの最後の日付には1席があります。一度購入すると、次の購入者は売り切れと表示されます。
    failed:
      title: 支払いが失敗し、その後再度行われる
      text: プロバイダーのページで「拒否」を選択すると、確認が再度支払い方法を選択するように促します。
    expired:
      title: 期限切れのカート
      text: '未払いのカートは、`bin/console shop:expire`が実行されると在庫が戻ります。'

ko:
  page_title: 시나리오
  page_icon: 'ph:bold/list-checks'
  shop: '상점으로 가기'
  cart: 장바구니
  intro: 'symfony-shop-ds에서 데모의 카탈로그: 배송된 티셔츠, 역할과 날짜가 포함된 워크숍 몇 자리, 선택한 금액의 기부. 장바구니에 담고 주문하세요: 주소, 결제 방법 — 데모 제공자의 카드, 테스트 모드의 Stripe, 송금 —, 확인.'
  cases:
    title: '해볼 것'
    bought:
      title: 주문하기
      text: '티셔츠를 주문하고 데모 제공자의 카드로 결제하세요. 페이지에서 « 결제 »를 클릭하세요.'
    sold_out:
      title: '매진된 날짜'
      text: '워크숍의 마지막 날짜에 한 자리가 있습니다. 한 번 구매하세요; 다음 구매자는 매진된 것을 보게 됩니다.'
    failed:
      title: '결제 실패 후 재시도'
      text: '제공자의 페이지에서 « 거절 »; 확인이 다시 결제 방법을 선택하도록 제안합니다.'
    expired:
      title: '만료된 장바구니'
      text: '결제되지 않은 장바구니는 `bin/console shop:expire`가 실행될 때 재고를 반환합니다.'

bn:
  page_title: পরিকল্পনা
  page_icon: 'ph:bold/list-checks'
  shop: 'দোকানে যান'
  cart: কার্ট
  intro: 'symfony-shop-ds একটি ক্যাটালগে: একটি টি-শার্ট পাঠানো হয়েছে, কয়েকটি সিটের ভূমিকাসহ ও তারিখসহ একটি কর্মশালা, আপনার পছন্দের পরিমাণের একটি দান। সেগুলো কার্টে রাখুন, তারপর অর্ডার করুন: ঠিকানা, কীভাবে পেমেন্ট করবেন — ডেমো প্রদানকারীর কার্ড, পরীক্ষামূলক মোডে Stripe, একটি স্থানান্তর —, নিশ্চিতকরণ।'
  cases:
    title: 'কী চেষ্টা করবেন'
    bought:
      title: 'একটি অর্ডার মাধ্যমে'
      text: 'একটি টি-শার্ট অর্ডার করুন এবং ডেমো প্রদানকারীর কার্ড দিয়ে পেমেন্ট করুন, তার পৃষ্ঠায় « Pay »।'
    sold_out:
      title: 'একটি তারিখ বিক্রি হয়ে গেছে'
      text: 'কর্মশালার শেষ তারিখে একটি সিট রয়েছে। এটি একবার কিনুন; পরবর্তী ক্রেতা এটি বিক্রি হয়ে গেছে পাবে।'
    failed:
      title: 'একটি পেমেন্ট ব্যর্থ হয়েছে, তারপর পুনরায় নেওয়া হয়েছে'
      text: 'প্রদানকারীর পৃষ্ঠায় « Decline »; নিশ্চিতকরণ আবার কীভাবে পেমেন্ট করবেন তা নির্বাচন করার প্রস্তাব দেয়।'
    expired:
      title: 'একটি কার্ট মেয়াদ শেষ হয়েছে'
      text: 'একটি অনাদায়ী কার্ট `bin/console shop:expire` চালানোর সময় তার স্টক ফেরত দেয়।'

th:
  page_title: สถานการณ์
  page_icon: 'ph:bold/list-checks'
  shop: ไปที่ร้าน
  cart: ตะกร้า
  intro: 'symfony-shop-ds บนแคตตาล็อกของการสาธิต: เสื้อยืดที่จัดส่ง, เวิร์กช็อปพร้อมบทบาทและวันที่ของที่นั่งบางส่วน, การบริจาคตามจำนวนที่คุณเลือก. ใส่สิ่งเหล่านี้ในตะกร้า แล้วสั่งซื้อ: ที่อยู่, วิธีการชำระเงิน — บัตรของผู้ให้บริการสาธิต, Stripe ในโหมดทดสอบ, การโอน —, การยืนยัน.'
  cases:
    title: ลองทำอะไรดี
    bought:
      title: สั่งซื้อผ่าน
      text: 'สั่งซื้อเสื้อยืดและชำระเงินด้วยบัตรของผู้ให้บริการสาธิต, « ชำระเงิน » บนหน้าของมัน.'
    sold_out:
      title: วันที่ขายหมด
      text: 'วันที่สุดท้ายของเวิร์กช็อปมีที่นั่งเดียว. ซื้อครั้งเดียว; ผู้ซื้อถัดไปจะพบว่ามันหมด.'
    failed:
      title: 'การชำระเงินล้มเหลว, แล้วกลับมาทำใหม่'
      text: '« ปฏิเสธ » บนหน้าของผู้ให้บริการ; การยืนยันเสนอให้เลือกวิธีการชำระเงินใหม่อีกครั้ง.'
    expired:
      title: ตะกร้าที่ปล่อยให้หมดอายุ
      text: 'ตะกร้าที่ไม่ได้ชำระเงินจะคืนสต็อกเมื่อรัน `bin/console shop:expire`.'

de:
  page_title: Szenarien
